name: Diagnostic ampleur bug lien match-direct lequipe.fr (lecture seule)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL de la page journée lequipe.fr à analyser"
        required: false
        type: string
        default: "https://www.lequipe.fr/Football/national-1-groupe-c/page-calendrier-resultats/2e-journee"

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Diagnostiquer
        working-directory: scripts
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: node diagnostic-ampleur-bug-lien-match.js
