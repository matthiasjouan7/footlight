name: Diagnostic toutes occurrences specifics

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Diagnostic
        working-directory: scripts
        run: node diagnostic-toutes-occurrences-specifics.js
