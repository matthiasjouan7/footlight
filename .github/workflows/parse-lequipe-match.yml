name: Parse lequipe.fr match (test, extraction buts/cartons, lecture seule)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL lequipe.fr d'une page match-direct à parser"
        required: true
        type: string
        default: "https://www.lequipe.fr/Football/match-direct/national-2-groupe-a/2025-2026/locmine-la-roche-sur-yon-live/680838"

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Extraire buts/cartons
        working-directory: scripts
        env:
          TARGET_URL: ${{ inputs.url }}
        run: node parse-lequipe-match.js
