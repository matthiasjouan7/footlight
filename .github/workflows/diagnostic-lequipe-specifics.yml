name: Diagnostic — structure des données de match L'Équipe (lecture seule)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL de la page calendrier-resultats d'une journée"
        required: true
        type: string

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Inspecter la structure des données
        working-directory: scripts
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: node diagnostic-lequipe-specifics.js
