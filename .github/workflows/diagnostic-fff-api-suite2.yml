name: Diagnostic API FFF National 1 groupe C — fetch natif page (lecture seule)

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Installer les navigateurs Playwright
        working-directory: scripts
        run: npx playwright install --with-deps chromium

      - name: Tester le fetch natif depuis le contexte page
        working-directory: scripts
        run: node diagnostic-fff-api-suite2.js
