name: Sync lequipe.fr -> calendrier_officiel (automatique)

on:
  schedule:
    # Chaque dimanche à 6h UTC — les matchs se jouent presque toujours le
    # samedi pour ces championnats, donc la journée est jouée avant ce
    # déclenchement.
    - cron: "0 6 * * 0"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        url:
          - "https://www.lequipe.fr/Football/national-1-groupe-a/page-calendrier-resultats"
          - "https://www.lequipe.fr/Football/national-1-groupe-b/page-calendrier-resultats"
          - "https://www.lequipe.fr/Football/national-1-groupe-c/page-calendrier-resultats"
          - "https://www.lequipe.fr/Football/national-2-groupe-a/page-calendrier-resultats"
          - "https://www.lequipe.fr/Football/national-2-groupe-b/page-calendrier-resultats"
          - "https://www.lequipe.fr/Football/national-2-groupe-c/page-calendrier-resultats"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Synchroniser
        working-directory: scripts
        env:
          TARGET_URL: ${{ matrix.url }}
          DRY_RUN: "false"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node sync-lequipe-to-calendrier.js
