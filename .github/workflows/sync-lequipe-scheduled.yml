name: Sync lequipe.fr -> calendrier_officiel (automatique)

on:
  schedule:
    # Chaque jour à 6h UTC (plutôt qu'hebdomadaire) — les championnats
    # jouent aussi en semaine (ex: vendredi), un cron du seul lundi laissait
    # les résultats de milieu de semaine plusieurs jours sans être repris.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      # Compétitions traitées SÉQUENTIELLEMENT dans un seul job (et non en
      # matrice parallèle comme avant) : des requêtes simultanées contre
      # lequipe.fr depuis plusieurs runners GitHub Actions déclenchent son
      # blocage CDN ("Access Denied", cf. diagnostic-detection-competition-
      # lequipe.js) beaucoup plus souvent qu'une requête à la fois — même
      # constat déjà fait et corrigé pour sync-transfermarkt-match-stats-n2
      # (voir son commentaire). `|| echo` sur chaque itération pour qu'un
      # blocage ponctuel sur une compétition n'interrompe pas les suivantes.
      - name: Synchroniser (séquentiel)
        working-directory: scripts
        env:
          DRY_RUN: "false"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          URLS=(
            "https://www.lequipe.fr/Football/national-1-groupe-a/page-calendrier-resultats"
            "https://www.lequipe.fr/Football/national-1-groupe-b/page-calendrier-resultats"
            "https://www.lequipe.fr/Football/national-1-groupe-c/page-calendrier-resultats"
            "https://www.lequipe.fr/Football/ligue-3/page-calendrier-resultats"
            "https://www.lequipe.fr/Football/national-2-groupe-a/page-calendrier-resultats"
            "https://www.lequipe.fr/Football/national-2-groupe-b/page-calendrier-resultats"
            "https://www.lequipe.fr/Football/national-2-groupe-c/page-calendrier-resultats"
            "https://www.lequipe.fr/Football/national-2-groupe-d/page-calendrier-resultats"
            "https://www.lequipe.fr/Football/national-2-groupe-e/page-calendrier-resultats"
            "https://www.lequipe.fr/Football/national-2-groupe-f/page-calendrier-resultats"
            "https://www.lequipe.fr/Football/national-2-groupe-g/page-calendrier-resultats"
            "https://www.lequipe.fr/Football/national-2-groupe-h/page-calendrier-resultats"
          )
          for URL in "${URLS[@]}"; do
            echo "########## $URL ##########"
            TARGET_URL="$URL" node sync-lequipe-to-calendrier.js || echo "Échec pour $URL, on continue avec la suivante."
            sleep 5
          done
