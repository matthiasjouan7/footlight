name: Diagnostic joueur La Roche-sur-Yon (lecture seule)

on:
  workflow_dispatch:
    inputs:
      joueur_id:
        description: "joueur_id à inspecter (défaut : Matthieu Villette)"
        required: false
        type: string

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Diagnostiquer
        working-directory: scripts
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOUEUR_ID: ${{ inputs.joueur_id }}
        run: node diagnostic-joueur-la-roche.js
