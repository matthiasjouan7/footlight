name: Découvre les clubs à joueurs FootLight (flashscore.fr, lecture seule)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL flashscore.fr de la page classement d'un groupe"
        required: true
        type: string
        default: "https://www.flashscore.fr/football/france/national-1-group-a/classement/"

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Installer Chromium (Playwright)
        working-directory: scripts
        run: npx playwright install --with-deps chromium

      - name: Découvrir les clubs
        working-directory: scripts
        env:
          TARGET_URL: ${{ inputs.url }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node discover-clubs-flashscore.js
