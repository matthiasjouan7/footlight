name: Diagnostic sélecteur de journée lequipe.fr (lecture seule)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL calendrier-resultats à inspecter"
        required: false
        type: string
        default: "https://www.lequipe.fr/Football/ligue-3/page-calendrier-resultats"

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Diagnostic
        working-directory: scripts
        env:
          TARGET_URL: ${{ inputs.url }}
        run: node diagnostic-lequipe-selectnav.js
