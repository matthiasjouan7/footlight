name: Enregistre une vidéo — buteurs / attaquants à suivre (lecture seule, aucune écriture)

on:
  workflow_dispatch:
    inputs:
      noms:
        description: "Prénom Nom des joueurs à filmer, séparés par des virgules"
        required: true
        type: string
      titre:
        description: "Titre de la carte d'ouverture (avant l'accent)"
        required: false
        type: string
        default: "Qui va"
      titre_accent:
        description: "Titre de la carte d'ouverture (partie accentuée dorée)"
        required: false
        type: string
        default: "confirmer ?"
      sous_titre:
        description: "Sous-titre de la carte d'ouverture"
        required: false
        type: string
        default: "Après une journée 1 explosive, ces attaquants sont attendus ce soir."

jobs:
  record:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Installer Chromium (Playwright)
        working-directory: scripts
        run: npx playwright install --with-deps chromium

      - name: Enregistrer la vidéo
        working-directory: scripts
        env:
          NOMS: ${{ inputs.noms }}
          TITRE: ${{ inputs.titre }}
          TITRE_ACCENT: ${{ inputs.titre_accent }}
          SOUS_TITRE: ${{ inputs.sous_titre }}
          OUT_DIR: ${{ github.workspace }}/demo-video-buteurs-out
        run: node record-video-buteurs.js

      - name: Publier la vidéo en artefact
        uses: actions/upload-artifact@v4
        with:
          name: demo-video-buteurs
          path: demo-video-buteurs-out/*.webm
          retention-days: 7

      # .webm n'est pas lisible sur iPhone/Safari, et l'artefact Actions
      # (stocké sur blob storage) n'est pas accessible depuis certains
      # environnements réseau restreints : convertit en .mp4 (H.264, lu
      # partout) et le pousse directement sur une branche du dépôt, servi
      # ensuite via raw.githubusercontent.com.
      - name: Convertir en mp4 (compatibilité universelle)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          webm=$(ls demo-video-buteurs-out/*.webm | head -1)
          ffmpeg -y -i "$webm" -c:v libx264 -pix_fmt yuv420p -movflags +faststart -c:a aac demo-video-buteurs-out/video.mp4

      - name: Publier sur la branche de livraison
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git checkout --orphan video-delivery
          git rm -rf --cached . > /dev/null 2>&1 || true
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name 'demo-video-buteurs-out' -exec rm -rf {} +
          mv demo-video-buteurs-out/video.mp4 .
          rm -rf demo-video-buteurs-out
          git add -A
          git commit -m "Livraison vidéo buteurs (run ${{ github.run_id }})"
          git push origin video-delivery --force
