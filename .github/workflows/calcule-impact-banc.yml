name: Calcule l'impact banc des remplaçants (lecture seule, aucune écriture)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL de la page de division (liste de matchs)"
        required: true
        type: string
        default: "https://www.foot-direct.com/france/ligue-3/"
      division:
        description: "Division FootLight correspondante (ex: Ligue 3)"
        required: true
        type: string
        default: "Ligue 3"
      groupe:
        description: "Groupe (ex: Unique)"
        required: false
        type: string
        default: "Unique"
      saison:
        description: "Saison (ex: 2026-2027)"
        required: true
        type: string
        default: "2026-2027"

jobs:
  calcule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Calculer l'impact banc
        working-directory: scripts
        env:
          TARGET_URL: ${{ inputs.url }}
          DIVISION: ${{ inputs.division }}
          GROUPE: ${{ inputs.groupe }}
          SAISON: ${{ inputs.saison }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node calcule-impact-banc.js
