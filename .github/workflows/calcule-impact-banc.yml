name: Calcule l'impact banc des remplaçants (rapport, écrit data/impact-banc.json sur "write")

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL de la page de division (liste de matchs)"
        required: true
        type: string
        default: "https://www.foot-direct.com/france/ligue-3/"
      division:
        description: "Division FootLight correspondante (ex: Ligue 3)"
        required: true
        type: string
        default: "Ligue 3"
      groupe:
        description: "Groupe (ex: Unique)"
        required: false
        type: string
        default: "Unique"
      saison:
        description: "Saison (ex: 2026-2027)"
        required: true
        type: string
        default: "2026-2027"
      write:
        description: "Écrire data/impact-banc.json et le committer sur main (sinon rapport seul)"
        required: false
        type: boolean
        default: false

jobs:
  calcule:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Calculer l'impact banc
        working-directory: scripts
        env:
          TARGET_URL: ${{ inputs.url }}
          DIVISION: ${{ inputs.division }}
          GROUPE: ${{ inputs.groupe }}
          SAISON: ${{ inputs.saison }}
          WRITE_JSON: ${{ inputs.write }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node calcule-impact-banc.js

      - name: Committer data/impact-banc.json sur main
        if: ${{ inputs.write == true }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add data/impact-banc.json
          git diff --cached --quiet && echo "Aucun changement, rien à committer." || (git commit -m "Met à jour le classement impact banc (super remplaçants)" && git push origin HEAD:main)
