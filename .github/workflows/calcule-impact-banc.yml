name: Calcule l'impact banc des remplaçants (rapport, écrit data/impact-banc.json sur "write")

on:
  schedule:
    # Chaque jour à 6h55 UTC — après les crons foot-direct.com (passes
    # décisives 6h45, classement passeurs 6h50), pour disposer des lignes
    # matchs_joueur/calendrier_officiel à jour avant de calculer l'impact
    # banc. Écriture réelle automatique (comme les autres crons "chaque
    # matin"), sur Ligue 3 + National 1 — mêmes divisions que
    # sync-foot-direct-passes.yml / sync-classement-passeurs.yml.
    - cron: "55 6 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "URL de la page de division (liste de matchs) — déclenchement manuel, une seule division"
        required: true
        type: string
        default: "https://www.foot-direct.com/france/ligue-3/"
      division:
        description: "Division FootLight correspondante (ex: Ligue 3)"
        required: true
        type: string
        default: "Ligue 3"
      groupe:
        description: "Groupe (ex: Unique, ou \"A,B,C\" pour National 1)"
        required: false
        type: string
        default: "Unique"
      saison:
        description: "Saison (ex: 2026-2027)"
        required: true
        type: string
        default: "2026-2027"
      write:
        description: "Écrire data/impact-banc.json et le committer sur main (sinon rapport seul)"
        required: false
        type: boolean
        default: false
      cibles:
        description: "Optionnel : CIBLES (JSON, plusieurs divisions) — remplace url/division/groupe si renseigné, pour tester le run combiné manuellement"
        required: false
        type: string
        default: ""

jobs:
  calcule:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Calculer l'impact banc
        working-directory: scripts
        env:
          # CIBLES (JSON, Ligue 3 + National 1) en déclenchement programmé,
          # ou via l'input "cibles" pour tester le run combiné manuellement —
          # sinon on retombe sur TARGET_URL/DIVISION/GROUPE (une seule
          # division à la fois).
          CIBLES: ${{ github.event_name == 'schedule' && '[{"url":"https://www.foot-direct.com/france/ligue-3/","division":"Ligue 3","groupe":"Unique"},{"url":"https://www.foot-direct.com/france/national-1/","division":"N1","groupe":"A,B,C"}]' || inputs.cibles }}
          TARGET_URL: ${{ inputs.url }}
          DIVISION: ${{ inputs.division }}
          GROUPE: ${{ inputs.groupe }}
          SAISON: ${{ inputs.saison || '2026-2027' }}
          WRITE_JSON: ${{ (github.event_name == 'schedule' || inputs.write == true) && 'true' || 'false' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node calcule-impact-banc.js

      - name: Committer data/impact-banc.json sur main
        if: ${{ github.event_name == 'schedule' || inputs.write == true }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add data/impact-banc.json
          git diff --cached --quiet && echo "Aucun changement, rien à committer." || (git commit -m "Met à jour le classement impact banc (super remplaçants)" && git push origin HEAD:main)
