name: Découverte composition FFF (lecture seule)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL de la page match epreuves.fff.fr à explorer"
        required: false
        type: string
        default: "https://epreuves.fff.fr/competition/match/56635087-hyeres-f-c-football-club-limonest-dardilly-saint-didier/match"

jobs:
  decouverte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Installer Chromium (Playwright)
        working-directory: scripts
        run: npx playwright install --with-deps chromium

      - name: Explorer
        working-directory: scripts
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: node decouverte-composition-fff.js
