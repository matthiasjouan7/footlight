name: Diagnostic — structure page classement passeurs (lecture seule)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL de la page classement des passeurs"
        required: true
        type: string

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Inspecter la structure de la page
        working-directory: scripts
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: node diagnostic-classement-passeurs.js
