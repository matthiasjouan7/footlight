name: Diagnostic footmercato.net N2 (lecture seule)

on:
  workflow_dispatch:
    inputs:
      url_calendrier:
        description: "URL de la page calendrier footmercato à inspecter"
        required: false
        type: string
        default: "https://www.footmercato.net/france/national-2/calendrier/8365150612397432064-journee-1"
      url_match_direct:
        description: "Si renseigné, saute le calendrier et teste directement cette page de match"
        required: false
        type: string
        default: ""

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Installer Chromium (Playwright)
        working-directory: scripts
        run: npx playwright install --with-deps chromium

      - name: Diagnostiquer
        working-directory: scripts
        env:
          URL_CALENDRIER: ${{ inputs.url_calendrier }}
          URL_MATCH_DIRECT: ${{ inputs.url_match_direct }}
        run: node diagnostic-footmercato-n2.js
