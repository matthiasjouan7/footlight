name: Sync stats officielles flashscore.fr -> stats_officielles (DRY_RUN par défaut)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL flashscore.fr (page effectif) d'un club"
        required: true
        type: string
        default: "https://www.flashscore.fr/equipe/caen/GjLn2QoH/effectif/"
      saison:
        description: "Saison (ex: 2026-2027)"
        required: true
        type: string
        default: "2026-2027"
      write:
        description: "Écrire réellement en base (sinon DRY_RUN)"
        required: false
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Installer Chromium (Playwright)
        working-directory: scripts
        run: npx playwright install --with-deps chromium

      - name: Synchroniser les stats officielles
        working-directory: scripts
        env:
          TARGET_URL: ${{ inputs.url }}
          SAISON: ${{ inputs.saison }}
          DRY_RUN: ${{ inputs.write == true && 'false' || 'true' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node sync-flashscore-officielles.js
