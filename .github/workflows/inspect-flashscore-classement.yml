name: Inspect classement flashscore.fr (test, lecture seule)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL flashscore.fr d'une page de compétition (classement)"
        required: true
        type: string
        default: "https://www.flashscore.fr/football/france/national-1-group-a/classement/"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Installer Chromium (Playwright)
        working-directory: scripts
        run: npx playwright install --with-deps chromium

      - name: Inspecter le classement
        working-directory: scripts
        env:
          TARGET_URL: ${{ inputs.url }}
        run: node inspect-flashscore-classement.js
