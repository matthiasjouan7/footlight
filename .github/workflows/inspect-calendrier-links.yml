name: Inspect liens calendrier -> match-direct (test, lecture seule)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL lequipe.fr d'une page calendrier-resultats"
        required: true
        type: string
        default: "https://www.lequipe.fr/Football/national-2-groupe-a/page-calendrier-resultats"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Vérifier les liens match-direct
        working-directory: scripts
        env:
          TARGET_URL: ${{ inputs.url }}
        run: node inspect-calendrier-links.js
