name: Enregistre une vidéo réseaux sociaux — joueurs libres (lecture seule, aucune écriture)

on:
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Installer Chromium (Playwright)
        working-directory: scripts
        run: npx playwright install --with-deps chromium

      - name: Enregistrer la vidéo
        working-directory: scripts
        env:
          OUT_DIR: ${{ github.workspace }}/demo-video-joueurs-libres-out
        run: node record-demo-video-joueurs-libres.js

      - name: Publier la vidéo en artefact
        uses: actions/upload-artifact@v4
        with:
          name: demo-video-joueurs-libres
          path: demo-video-joueurs-libres-out/*.webm
          retention-days: 7
