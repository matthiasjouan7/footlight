name: Migre le doublon calendrier 3042 vers 1966 (VFC La Roche-sur-Yon)

on:
  workflow_dispatch:
    inputs:
      write:
        description: "Appliquer réellement en base (sinon DRY_RUN)"
        required: false
        type: boolean
        default: false

jobs:
  migrer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Migrer
        working-directory: scripts
        env:
          DRY_RUN: ${{ inputs.write == true && 'false' || 'true' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node migre-doublon-3042-vers-1966.js
