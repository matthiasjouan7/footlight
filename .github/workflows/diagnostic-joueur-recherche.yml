name: Diagnostic recherche joueur (lecture seule)

on:
  workflow_dispatch:
    inputs:
      recherche:
        description: "Prénom et/ou nom à rechercher"
        required: true
        type: string

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Diagnostic
        working-directory: scripts
        env:
          RECHERCHE: ${{ inputs.recherche }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node diagnostic-joueur-recherche.js
