name: Parse lequipe.fr (test, extraction only)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL lequipe.fr d'une page calendrier-resultats à parser"
        required: true
        type: string

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Parser la page
        working-directory: scripts
        env:
          TARGET_URL: ${{ inputs.url }}
        run: node parse-lequipe.js
