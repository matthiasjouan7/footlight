name: Vérifie un joueur (profil + stats), lecture seule

on:
  workflow_dispatch:
    inputs:
      nom:
        description: "Prénom Nom du joueur à rechercher"
        required: true
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Vérifier le joueur
        working-directory: scripts
        env:
          NOM_RECHERCHE: ${{ inputs.nom }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node check-joueur.js
