name: Vérifie un joueur (profil + stats), lecture seule

on:
  workflow_dispatch:
    inputs:
      nom:
        description: "Prénom Nom du joueur à rechercher (optionnel si club renseigné)"
        required: false
        type: string
      club:
        description: "Club à rechercher (optionnel, ex: pour trouver le gardien d'un club)"
        required: false
        type: string
      poste:
        description: "Poste à filtrer (optionnel, ex: gardien)"
        required: false
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Vérifier le joueur
        working-directory: scripts
        env:
          NOM_RECHERCHE: ${{ inputs.nom }}
          CLUB_RECHERCHE: ${{ inputs.club }}
          POSTE_RECHERCHE: ${{ inputs.poste }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node check-joueur.js
