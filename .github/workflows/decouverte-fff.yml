name: Découverte epreuves.fff.fr (lecture seule)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL epreuves.fff.fr à explorer"
        required: true
        type: string
        default: "https://epreuves.fff.fr/competition/match/55670074-sporting-club-aubagne-air-bel-u-s-thionville-lusitanos/autres-matchs"

jobs:
  decouverte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Installer Chromium (Playwright)
        working-directory: scripts
        run: npx playwright install --with-deps chromium

      - name: Découvrir
        working-directory: scripts
        env:
          TARGET_URL: ${{ inputs.url }}
        run: node decouverte-fff.js
