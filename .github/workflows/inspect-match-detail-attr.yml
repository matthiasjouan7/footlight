name: Inspect lequipe.fr match detail - attribut HTML (test, lecture seule)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL lequipe.fr d'une page match-direct à inspecter"
        required: true
        type: string
        default: "https://www.lequipe.fr/Football/match-direct/national-2-groupe-a/2025-2026/locmine-la-roche-sur-yon-live/680838"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Inspecter l'attribut HTML porteur des données
        working-directory: scripts
        env:
          TARGET_URL: ${{ inputs.url }}
        run: node inspect-match-detail-attr.js
