name: Sync classement des passeurs -> stats_officielles (DRY_RUN par défaut)

on:
  schedule:
    # Chaque jour à 6h50 UTC — juste après sync-foot-direct-passes.yml, pour
    # recouper avec le total saison du classement des passeurs.
    - cron: "50 6 * * *"
  workflow_dispatch:
    inputs:
      write:
        description: "Écrire réellement en base (sinon DRY_RUN)"
        required: false
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - url: "https://www.foot-direct.com/france/ligue-3/classement-passeurs"
            division: "Ligue 3"
          - url: "https://www.foot-direct.com/france/national-1/classement-passeurs"
            division: "N1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Synchroniser le classement des passeurs
        working-directory: scripts
        env:
          TARGET_URL: ${{ matrix.url }}
          DIVISION: ${{ matrix.division }}
          SAISON: "2026-2027"
          # Écriture réelle automatique tous les matins ; en déclenchement
          # manuel, DRY_RUN reste la valeur sûre par défaut sauf si "write"
          # est explicitement coché.
          DRY_RUN: ${{ (github.event_name == 'schedule' || inputs.write == true) && 'false' || 'true' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node sync-classement-passeurs.js
