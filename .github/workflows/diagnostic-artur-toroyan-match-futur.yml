name: Diagnostic joueur match futur déjà validé (lecture seule)

on:
  workflow_dispatch:
    inputs:
      nom_recherche:
        description: "Nom (ou fragment) du joueur à rechercher"
        required: false
        type: string
        default: "toroyan"

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Diagnostiquer
        working-directory: scripts
        env:
          NOM_RECHERCHE: ${{ inputs.nom_recherche }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node diagnostic-artur-toroyan-match-futur.js
