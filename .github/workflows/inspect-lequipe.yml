name: Inspect lequipe.fr structured data (test)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL lequipe.fr à inspecter"
        required: true
        type: string

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Inspecter la page
        working-directory: scripts
        env:
          TARGET_URL: ${{ inputs.url }}
        run: node inspect-lequipe.js
