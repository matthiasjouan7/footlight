name: Rattrapage calendrier Esteban Hari (ciblé, DRY_RUN par défaut)

on:
  workflow_dispatch:
    inputs:
      write:
        description: 'Écrire réellement (sinon DRY_RUN)'
        type: boolean
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Générer
        working-directory: scripts
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.write == true && 'false' || 'true' }}
        run: node generer-calendrier-esteban-hari.js
