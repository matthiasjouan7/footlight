name: Diagnostic captures d'écran (toutes sources externes)

on:
  workflow_dispatch:
  schedule:
    # Toutes les 6h : les captures sur la branche diagnostic-captures sont
    # ainsi déjà disponibles quand un blocage est signalé, sans avoir à
    # déclencher le diagnostic puis attendre son exécution (Playwright +
    # navigation ~2-3 min à chaque fois).
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Installer Chromium (Playwright)
        working-directory: scripts
        run: npx playwright install --with-deps chromium

      - name: Capturer
        working-directory: scripts
        run: node diagnostic-captures-etat-sources-externes.js

      - name: Publier les captures
        uses: actions/upload-artifact@v4
        with:
          name: captures-diagnostic-sources
          path: scripts/captures/
          retention-days: 3

      # En plus de l'artefact (dont le téléchargement direct n'est pas
      # toujours accessible), pousse les captures sur une branche dédiée
      # pour qu'elles restent lisibles via l'API GitHub (get_file_contents).
      - name: Publier les captures sur la branche diagnostic-captures
        run: |
          cp -r scripts/captures /tmp/captures-a-publier
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan diagnostic-captures
          git rm -rf . > /dev/null 2>&1 || true
          rm -rf ./*
          cp -r /tmp/captures-a-publier/* .
          git add -A
          git commit -m "Captures diagnostic sources externes $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force origin diagnostic-captures
