name: Corrige la saison des stats de Cherif Diallo (2024-2025 -> 2025-2026) — DRY_RUN par défaut

on:
  workflow_dispatch:
    inputs:
      write:
        description: "Écrire réellement en base (sinon DRY_RUN)"
        required: false
        type: boolean
        default: false

jobs:
  corrige:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Corriger la saison
        working-directory: scripts
        env:
          DRY_RUN: ${{ inputs.write == true && 'false' || 'true' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node corrige-saison-diallo.js
