name: FFF National 1 groupe C — récupère toute la saison (lecture seule)

on:
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Installer les navigateurs Playwright
        working-directory: scripts
        run: npx playwright install --with-deps chromium

      - name: Récupérer toute la saison groupe C
        working-directory: scripts
        run: node fff-national1-groupec-fetch-saison.js
