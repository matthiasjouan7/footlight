name: Diagnostic échec rapprochement Transfermarkt N2 (lecture seule)

on:
  workflow_dispatch:
    inputs:
      calendrier_officiel_id:
        description: "ID calendrier_officiel du match à diagnostiquer"
        required: true
        type: string
      groupe:
        description: "Groupe National 2 (A-H)"
        required: true
        type: choice
        options: ["A", "B", "C", "D", "E", "F", "G", "H"]

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Installer Chromium (Playwright)
        working-directory: scripts
        run: npx playwright install --with-deps chromium

      - name: Diagnostiquer
        working-directory: scripts
        env:
          CALENDRIER_OFFICIEL_ID: ${{ inputs.calendrier_officiel_id }}
          GROUPE: ${{ inputs.groupe }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node diagnostic-transfermarkt-n2-echec-match.js
