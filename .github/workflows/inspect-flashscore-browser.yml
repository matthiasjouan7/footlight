name: Inspect flashscore.fr via navigateur (test, lecture seule)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL flashscore.fr (page effectif) à inspecter"
        required: true
        type: string
        default: "https://www.flashscore.fr/equipe/caen/GjLn2QoH/effectif/"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Installer Chromium (Playwright)
        working-directory: scripts
        run: npx playwright install --with-deps chromium

      - name: Inspecter la page via navigateur
        working-directory: scripts
        env:
          TARGET_URL: ${{ inputs.url }}
        run: node inspect-flashscore-browser.js
