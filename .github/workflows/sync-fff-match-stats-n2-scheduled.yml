name: Sync stats de match FFF -> matchs_joueur (National 2, automatique)

on:
  # Cron désactivé : epreuves.fff.fr bloque désormais les IP des runners
  # GitHub Actions (403 "application momentanément indisponible", page de
  # blocage anti-bot type Akamai, confirmé stable sur plusieurs jours via
  # diagnostic-jeton-fff-introuvable.js). Le script échouait à 100% depuis
  # le 02/09 (0 écriture) sans jamais alimenter matchs_joueur — inutile de
  # continuer à consommer des minutes CI pour rien. National 2 s'appuie
  # désormais uniquement sur sync-transfermarkt-match-stats-n2-scheduled.
  # Laissé en workflow_dispatch au cas où le blocage se lèverait côté FFF.
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        groupe: ["A", "B", "C", "D", "E", "F", "G", "H"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Installer Chromium (Playwright)
        working-directory: scripts
        run: npx playwright install --with-deps chromium

      - name: Synchroniser
        working-directory: scripts
        env:
          GROUPE: ${{ matrix.groupe }}
          LIMITE_MATCHS: "60"
          DRY_RUN: "false"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node sync-fff-match-stats-n2.js
