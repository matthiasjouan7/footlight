name: Sync stats de match FFF -> matchs_joueur (National 2, automatique)

on:
  schedule:
    # 7h00 UTC — après la synchro calendrier lequipe.fr (6h00) et la
    # synchro stats lequipe.fr (6h30), pour que calendrier_officiel soit
    # à jour avant de rapprocher les matchs FFF.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        groupe: ["A", "B", "C", "D", "E", "F", "G", "H"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Installer Chromium (Playwright)
        working-directory: scripts
        run: npx playwright install --with-deps chromium

      - name: Synchroniser
        working-directory: scripts
        env:
          GROUPE: ${{ matrix.groupe }}
          LIMITE_MATCHS: "60"
          DRY_RUN: "false"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node sync-fff-match-stats-n2.js
