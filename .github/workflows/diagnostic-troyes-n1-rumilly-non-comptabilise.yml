name: Diagnostic Troyes N1 - match Rumilly non comptabilisé (lecture seule)

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Diagnostiquer
        working-directory: scripts
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node diagnostic-troyes-n1-rumilly-non-comptabilise.js
