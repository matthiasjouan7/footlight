name: Diagnostic — clubs distincts de calendrier_officiel (lecture seule)

on:
  workflow_dispatch:
    inputs:
      division:
        description: "Division (ex: Ligue 3)"
        required: true
        type: string
        default: "Ligue 3"
      groupe:
        description: "Groupe (ex: Unique)"
        required: false
        type: string
        default: "Unique"
      saison:
        description: "Saison (ex: 2026-2027)"
        required: true
        type: string
        default: "2026-2027"

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Lister les clubs
        working-directory: scripts
        env:
          DIVISION: ${{ inputs.division }}
          GROUPE: ${{ inputs.groupe }}
          SAISON: ${{ inputs.saison }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node diagnostic-clubs-calendrier.js
