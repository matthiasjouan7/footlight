name: Découverte effectif transfermarkt.fr (lecture seule)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL transfermarkt.fr d'un club (page startseite ou kader)"
        required: true
        type: string
        default: "https://www.transfermarkt.fr/fc-chambly/startseite/verein/35012/saison_id/2026"

jobs:
  decouverte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Découvrir
        working-directory: scripts
        env:
          TARGET_URL: ${{ inputs.url }}
        run: node decouverte-effectif-transfermarkt.js
