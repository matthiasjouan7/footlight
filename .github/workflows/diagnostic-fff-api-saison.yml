name: Diagnostic API FFF National 1 groupe C — saison complète (lecture seule)

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inspecter l'API sur toute la saison
        working-directory: scripts
        run: node diagnostic-fff-api-saison.js
