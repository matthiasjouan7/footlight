name: Diagnostic calendrier_officiel par club, lecture seule

on:
  workflow_dispatch:
    inputs:
      club:
        description: "Club à rechercher (ex: Caen)"
        required: true
        type: string

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Diagnostiquer
        working-directory: scripts
        env:
          CLUB_RECHERCHE: ${{ inputs.club }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node diagnostic-calendrier-club.js
