name: Nettoie les ambiguïtés calendrier en masse (DRY_RUN par défaut)

on:
  workflow_dispatch:
    inputs:
      write:
        description: "Écrire réellement en base (sinon DRY_RUN)"
        required: false
        type: boolean
        default: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        division: ["N1", "N2", "Ligue 3"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: "Nettoyer les ambiguïtés (${{ matrix.division }})"
        working-directory: scripts
        env:
          DIVISION: ${{ matrix.division }}
          DRY_RUN: ${{ inputs.write == true && 'false' || 'true' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node nettoyer-ambiguites-n1.js
