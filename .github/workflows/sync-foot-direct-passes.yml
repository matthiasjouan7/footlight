name: Sync passes décisives par match foot-direct.com (DRY_RUN par défaut)

on:
  schedule:
    # Chaque jour à 6h45 UTC — après la synchro L'Équipe (6h30) qui met à
    # jour matchs_joueur, pour retrouver les passes décisives des matchs
    # déjà joués (y compris pour un joueur nouvellement inscrit).
    - cron: "45 6 * * *"
  workflow_dispatch:
    inputs:
      write:
        description: "Écrire réellement en base (sinon DRY_RUN)"
        required: false
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - url: "https://www.foot-direct.com/france/ligue-3/"
            division: "Ligue 3"
            groupe: "Unique"
          # foot-direct.com n'a qu'une seule page pour tout le National 1
          # (pas de page par groupe séparée comme sur lequipe.fr, vérifié via
          # diagnostic-foot-direct-national1-urls.js) : les 3 groupes sont
          # passés ensemble à GROUPE (sync-foot-direct-passes.js les
          # interroge tous via .in('groupe', ...) plutôt qu'une égalité
          # stricte).
          - url: "https://www.foot-direct.com/france/national-1/"
            division: "N1"
            groupe: "A,B,C"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Synchroniser les passes décisives par match
        working-directory: scripts
        env:
          TARGET_URL: ${{ matrix.url }}
          DIVISION: ${{ matrix.division }}
          GROUPE: ${{ matrix.groupe }}
          SAISON: "2026-2027"
          # Écriture réelle automatique tous les matins ; en déclenchement
          # manuel, DRY_RUN reste la valeur sûre par défaut sauf si "write"
          # est explicitement coché.
          DRY_RUN: ${{ (github.event_name == 'schedule' || inputs.write == true) && 'false' || 'true' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node sync-foot-direct-passes.js
