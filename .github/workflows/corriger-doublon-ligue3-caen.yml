name: Corrige le doublon calendrier Ligue 3 SM Caen (DRY_RUN par défaut)

on:
  workflow_dispatch:
    inputs:
      write:
        description: "Supprimer réellement en base (sinon DRY_RUN)"
        required: false
        type: boolean
        default: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Corriger le doublon
        working-directory: scripts
        env:
          DRY_RUN: ${{ inputs.write == true && 'false' || 'true' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node corriger-doublon-ligue3-caen.js
