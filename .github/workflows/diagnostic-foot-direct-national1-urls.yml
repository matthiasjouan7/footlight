name: Diagnostic URLs foot-direct.com National 1 (lecture seule)

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Tester les URLs candidates
        working-directory: scripts
        run: node diagnostic-foot-direct-national1-urls.js
